name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python for the preview package test
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build for the project-site path
        env:
          SITE_URL: https://prompolu.github.io
          SITE_BASE_PATH: /promark-marketing-agency-
        run: npm run build
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      # Overwrites the generated site files but keeps everything else on gh-pages, such as the preview/ folders.
      - name: Publish the build over gh-pages
        run: |
          cp -R dist/. gh-pages/
          touch gh-pages/.nojekyll
          cd gh-pages
          git add -A
          git status --short
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy Promark static website to GitHub Pages (${GITHUB_SHA::7})"
          git push origin HEAD:gh-pages
