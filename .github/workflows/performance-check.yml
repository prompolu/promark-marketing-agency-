name: Design reference inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser tooling
        run: npm install --prefix /tmp/reference-tools --no-save --ignore-scripts --no-audit --no-fund puppeteer-core@25.16.0
      - name: Inspect the public design reference
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          node tools/inspect-reference.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dopamine-reference-inspection
          path: reference-report/
          if-no-files-found: error
          retention-days: 7
